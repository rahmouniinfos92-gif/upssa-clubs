services:
  club-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upssa-club-portal
    restart: always
    ports:
      - "80:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./data/clubs.db:/app/backend/clubs.db
      - ./data/uploads:/app/backend/uploads

